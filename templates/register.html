{% extends "base.html" %}{% block title %}Sign up | TravelEase{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">START EXPLORING</span><h2>Create your account</h2><p class="muted">Join TravelEase and plan your next trip.</p><form method="post"><label>Full name</label><input class="form-control mb-3" name="name" required maxlength="100" placeholder="Your name"><label>Email address</label><input class="form-control mb-3" type="email" name="email" required placeholder="you@example.com"><label>Password (minimum 8 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required placeholder="Create a password"><button class="btn btn-primary btn-lg w-100">Create account</button></form><p class="mt-4 text-center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>
{% endblock %}
